AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Additional loader workers for fidelity-scale ingests. Unlike loader-ec2.cfn.yaml
  (single instance, auto-starts one load from UserData), these bootstrap only:
  they fetch the suite bundle and then idle, so loads are driven over SSM with a
  disjoint --only index list per worker. That is what makes the ingest parallel
  across indices without two workers ever racing on the same index (create_index
  DELETEs before it PUTs).

  Deploy:
    aws cloudformation deploy --stack-name ppl-perf-tier2-loader-fleet \
      --template-file loader-fleet.cfn.yaml --capabilities CAPABILITY_NAMED_IAM \
      --parameter-overrides AmiId=... SubnetId=... VpcId=... Count=2

Parameters:
  AmiId:        { Type: AWS::EC2::Image::Id }
  SubnetId:     { Type: AWS::EC2::Subnet::Id }
  VpcId:        { Type: AWS::EC2::VPC::Id }
  InstanceType: { Type: String, Default: c7g.4xlarge }   # 16 vCPU arm64
  Count:        { Type: Number, Default: 2 }
  CodeBucket:   { Type: String, Default: ppl-perf-tier2-loader-924196221507 }
  CodeKey:      { Type: String, Default: perf-suite.tgz }
  PwSsmParam:   { Type: String, Default: /ppl-perf-tier2/fgac-password }

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: ppl-perf-tier2-loader-fleet-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore]
      Policies:
        - PolicyName: loader
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - { Effect: Allow, Action: [s3:GetObject], Resource: !Sub "arn:aws:s3:::${CodeBucket}/*" }
              - { Effect: Allow, Action: [ssm:GetParameter], Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PwSsmParam}" }
              - { Effect: Allow, Action: [kms:Decrypt], Resource: "*" }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref Role] }

  Sg:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ppl loader fleet egress-only
      VpcId: !Ref VpcId

  LaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref AmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: { Arn: !GetAtt InstanceProfile.Arn }
        SecurityGroupIds: [!Ref Sg]
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs: { VolumeSize: 16, VolumeType: gp3, DeleteOnTermination: true }
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            set -x; exec > /var/log/loader-bootstrap.log 2>&1
            dnf install -y python3 python3-pip tar gzip awscli-2 || dnf install -y python3 python3-pip tar gzip
            rm -rf /opt/perf-suite && mkdir -p /opt/perf-suite && cd /opt/perf-suite
            aws s3 cp s3://${CodeBucket}/${CodeKey} perf-suite.tgz --region ${AWS::Region}
            tar xzf perf-suite.tgz
            touch /opt/LOADER_READY

  Asg:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      AutoScalingGroupName: ppl-perf-tier2-loader-fleet
      MinSize: 0
      MaxSize: 8
      DesiredCapacity: !Ref Count
      VPCZoneIdentifier: [!Ref SubnetId]
      LaunchTemplate:
        LaunchTemplateId: !Ref LaunchTemplate
        Version: !GetAtt LaunchTemplate.LatestVersionNumber
      Tags:
        - { Key: Name, Value: ppl-perf-tier2-loader-fleet, PropagateAtLaunch: true }

Outputs:
  AsgName: { Value: !Ref Asg }
